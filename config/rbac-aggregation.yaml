apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hostedcontrolplane-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups:
      - controlplane.cluster.x-k8s.io
    resources:
      - hostedcontrolplanes
      - hostedcontrolplanes/status
      - hostedcontrolplanes/scale
      - hostedcontrolplanetemplates
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hostedcontrolplane-editor
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - controlplane.cluster.x-k8s.io
    resources:
      - hostedcontrolplanes
      - hostedcontrolplanes/scale
      - hostedcontrolplanetemplates
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - controlplane.cluster.x-k8s.io
    resources:
      - hostedcontrolplanes/status
    verbs:
      - get
      - list
      - watch
